[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-fft-lab"
version = "0.1.0"
description = "Vietnamese weather anomaly research tool using FFT and Isolation Forest"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["weather_lab*"]

[project.scripts]
weather-lab = "weather_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
